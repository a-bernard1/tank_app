; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

;[env:uno]
;platform = atmelavr
;board = uno
;framework = arduino

;monitor_port = /dev/ttyUSB1
;monitor_speed = 9600

[env:uno1]
platform = atmelavr
board = uno
framework = arduino
; Include only sender_code.cpp, ignore receiver_code.cpp
build_src_filter = +<mainUNO1.cpp> +<Transmission.hpp> +<Transmission.cpp> -<mainUNO2.cpp>
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 9600

[env:uno2]
platform = atmelavr
board = uno
framework = arduino
; Include only receiver_code.cpp, ignore sender_code.cpp
build_src_filter = +<mainUNO2.cpp> +<Transmission.hpp> +<Transmission.cpp> -<mainUNO1.cpp>
upload_port = /dev/ttyUSB1
monitor_port = /dev/ttyUSB1
monitor_speed = 9600